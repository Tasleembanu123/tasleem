
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #090019, #241052, #087eae);
        }

        .login-box {
            width: 350px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 25px #6d28d9;
            color: white;
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        p {
            margin-bottom: 25px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 8px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .register {
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #67e8f9;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Welcome Back!</h2>
        <p>Please login to your account</p>

        <form onsubmit="login(event)">
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <input type="password" id="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <div class="register">
            Don't have an account?
            <a href="#" onclick="alert('Registration page coming soon!')">
                Register
            </a>
        </div>
    </div>

    <script>
        function login(event) {
            event.preventDefault();

            let email = document.getElementById("email").value;

            alert("Login form submitted for: " + email);
        }
    </script>

</body>
</html>
