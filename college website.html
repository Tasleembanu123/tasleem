
<!DOCTYPE html>
<html>
<head>
    <title>ABC College</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
            background-color: #f2f5f9;
        }

        header {
            background-color: navy;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            background-color: lightblue;
            padding: 40px;
        }

        section {
            background-color: white;
            margin: 15px;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        footer {
            background-color: navy;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ABC College</h1>
        <p>Learn Today, Lead Tomorrow</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#courses">Courses</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="hero" id="home">
        <h2>Welcome to ABC College</h2>
        <p>Your Future Starts Here!</p>
        <button>Join Now</button>
    </div>

    <section id="about">
        <h2>About Us</h2>
        <p>We provide quality education to students.</p>
    </section>

    <section id="courses">
        <h2>Our Courses</h2>
        <p>BCA | BBA | B.Com | BA</p>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>Email: abccollege@example.com</p>
        <p>Phone: 9876543210</p>
    </section>

    <footer>
        <p>Copyright 2026 ABC College</p>
    </footer>

</body>
</html>
